<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #1d2671, #c33764); color: #fff; }
    .game { background: rgba(0,0,0,0.35); padding: 30px 40px; border-radius: 20px; width: 360px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    h1 { margin-bottom: 20px; font-size: 24px; letter-spacing: 1px; }
    .choices { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .choices button { width: 90px; height: 90px; border-radius: 50%; border: none; font-size: 14px; font-weight: bold; cursor: pointer; transition: transform 0.2s, background 0.2s; }
    .choices button:hover { transform: scale(1.1); background: #ffcc00; color: #000; }
    .arena { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
    .player { width: 120px; }
    .player p { margin-bottom: 8px; font-size: 14px; opacity: 0.9; }
    .image-box { width: 120px; height: 120px; border-radius: 16px; background: rgba(255,255,255,0.15); display: flex; justify-content: center; align-items: center; font-size: 14px; animation: pop 0.3s ease; }
    @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .result { margin: 15px 0; font-size: 18px; font-weight: bold; }
    .score { margin-bottom: 15px; font-size: 14px; }
    .reset { border: none; padding: 10px 18px; border-radius: 20px; background: #ff4d4d; color: #fff; cursor: pointer; transition: background 0.2s; }
    .reset:hover { background: #ff1a1a; }
  </style>
</head>
<body>
  <div class="game">
    <h1>Rock • Paper • Scissors</h1>
    <div class="choices">
      <button onclick="play('rock')">Rock</button>
      <button onclick="play('paper')">Paper</button>
      <button onclick="play('scissors')">Scissors</button>
    </div>
    <div class="arena">
      <div class="player">
        <p>You</p>
        <div class="image-box js-user-image">Image</div>
      </div>
      <div class="player">
        <p>Computer</p>
        <div class="image-box js-computer-image">Image</div>
      </div>
    </div>
    <div class="result js-result">Make your move</div>
    <div class="score js-score"></div>
    <button class="reset" onclick="resetScore()">Reset Score</button>
  </div>

  <script>
    let score = JSON.parse(localStorage.getItem('score')) || { wins: 0, losses: 0, ties: 0 };
    let userMove = '';
    let computerMove = '';
    let result = '';

    updateScore();

    function pickComputerMove() {
      const randomNumber = Math.random();
      if (randomNumber < 1 / 3) return 'rock';
      else if (randomNumber < 2 / 3) return 'paper';
      else return 'scissors';
    }

    function play(move) {
      userMove = move;
      computerMove = pickComputerMove();

      if (userMove === computerMove) { result = 'Tie'; score.ties++; }
      else if ((userMove==='rock'&&computerMove==='scissors')||(userMove==='paper'&&computerMove==='rock')||(userMove==='scissors'&&computerMove==='paper')) { result='You win'; score.wins++; }
      else { result='You lose'; score.losses++; }

      localStorage.setItem('score', JSON.stringify(score));

      if(score.wins >= 10) {
        alert('Tebrikler, buyuk is bacardiniz!');
        resetScore();
      } else {
        updateUI();
      }
    }

    function updateUI() {
      document.querySelector('.js-result').innerText = result;
      document.querySelector('.js-user-image').innerText = userMove;
      document.querySelector('.js-computer-image').innerText = computerMove;
      updateScore();
    }

    function updateScore() {
      document.querySelector('.js-score').innerText = `Wins: ${score.wins} | Losses: ${score.losses} | Ties: ${score.ties}`;
    }

    function resetScore() {
      score = { wins: 0, losses: 0, ties: 0 };
      localStorage.setItem('score', JSON.stringify(score));
      updateScore();
      document.querySelector('.js-result').innerText = 'Score reset';
    }
  </script>
</body>
</html>
